<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avatar-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E2633"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#111318"/>
    </radialGradient>

    <!-- Mint Gradients -->
    <linearGradient id="avatar-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BFFDF"/>
      <stop offset="100%" stop-color="#54E1C1"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Chassis -->
  <rect x="4" y="4" width="152" height="152" rx="28" fill="url(#avatar-bg)" stroke="#303642" stroke-width="1.5"/>

  <!-- Subtle Inner Guide Ring -->
  <circle cx="80" cy="80" r="62" fill="none" stroke="#303642" stroke-width="0.8" stroke-dasharray="3,5" opacity="0.6"/>

  <!-- Circuit Trace Elements from Perimeter to Core -->
  <!-- Top Traces -->
  <line x1="80" y1="12" x2="80" y2="34" stroke="#54E1C1" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="80" cy="16" r="2" fill="#54E1C1" opacity="0.7"/>

  <!-- Left Trace -->
  <path d="M 14 80 L 32 80 L 44 68 L 54 68" fill="none" stroke="#54E1C1" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="18" cy="80" r="2" fill="#54E1C1" opacity="0.7"/>

  <!-- Right Trace with Amber Node -->
  <path d="M 146 80 L 128 80 L 116 92 L 106 92" fill="none" stroke="#F0B67F" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="142" cy="80" r="2.5" fill="#F0B67F"/>

  <!-- Bottom Traces -->
  <line x1="80" y1="148" x2="80" y2="126" stroke="#54E1C1" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="80" cy="144" r="2" fill="#54E1C1" opacity="0.7"/>

  <!-- Central Processing Core Container -->
  <rect x="42" y="42" width="76" height="76" rx="16" fill="#191D24" stroke="#54E1C1" stroke-width="1.5" filter="url(#core-glow)"/>
  <rect x="48" y="48" width="64" height="64" rx="12" fill="#111318" stroke="#303642" stroke-width="1"/>

  <!-- Stylized Geometric Developer Glyph: < / > + Logic Nodes -->
  <!-- Left Angle Bracket < -->
  <path d="M 66 66 L 56 80 L 66 94" fill="none" stroke="url(#avatar-mint)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / Divider -->
  <line x1="84" y1="64" x2="76" y2="96" stroke="#F0B67F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Angle Bracket > -->
  <path d="M 94 66 L 104 80 L 94 94" fill="none" stroke="url(#avatar-mint)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Micro Logic Node Dots on Corners -->
  <circle cx="48" cy="48" r="1.5" fill="#54E1C1"/>
  <circle cx="112" cy="48" r="1.5" fill="#F0B67F"/>
  <circle cx="48" cy="112" r="1.5" fill="#F0B67F"/>
  <circle cx="112" cy="112" r="1.5" fill="#54E1C1"/>
</svg>
