<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="65%" cy="40%" r="65%" fx="60%" fy="35%">
      <stop offset="0%" stop-color="#24221D" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#141416" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="1"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB0"/>
      <stop offset="50%" stop-color="#D6B878"/>
      <stop offset="100%" stop-color="#9E8045"/>
    </linearGradient>

    <linearGradient id="gold-subtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B878" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D6B878" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D6B878" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B878" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D6B878" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="ivory-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DDD5"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.07"/>
      <circle cx="0" cy="0" r="0.75" fill="#D6B878" fill-opacity="0.25"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bg-glow)"/>
  <rect width="1200" height="400" fill="url(#arch-grid)"/>

  <!-- Subtle Isometric Structural Guides (Architecture Aesthetic) -->
  <g opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4,8"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4,8"/>
    <line x1="120" y1="0" x2="120" y2="400" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4,8"/>
    <line x1="1080" y1="0" x2="1080" y2="400" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4,8"/>
  </g>

  <!-- Network & Graph Visualization Graphic (Abstract Software Architecture & Data Structures) -->
  <g transform="translate(720, 30)" opacity="0.85">
    <!-- Graph Connections -->
    <line x1="80" y1="70" x2="220" y2="40" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="220" y1="40" x2="330" y2="110" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="80" y1="70" x2="150" y2="180" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="220" y1="40" x2="150" y2="180" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="150" y1="180" x2="280" y2="210" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="330" y1="110" x2="280" y2="210" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="280" y1="210" x2="380" y2="280" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="150" y1="180" x2="90" y2="290" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="90" y1="290" x2="220" y2="320" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="280" y1="210" x2="220" y2="320" stroke="url(#line-glow)" stroke-width="1.2"/>
    <line x1="330" y1="110" x2="420" y2="130" stroke="url(#line-glow)" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="220" y1="40" x2="270" y2="-10" stroke="url(#line-glow)" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Concentric Target Rings on Key Hub Node -->
    <circle cx="280" cy="210" r="32" fill="none" stroke="#D6B878" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="280" cy="210" r="54" fill="none" stroke="#D6B878" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="5,5"/>
    <circle cx="150" cy="180" r="24" fill="none" stroke="#D6B878" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Graph Nodes -->
    <circle cx="80" cy="70" r="4" fill="#D6B878" filter="url(#soft-glow)"/>
    <circle cx="220" cy="40" r="6" fill="#F2DEB0" filter="url(#soft-glow)"/>
    <circle cx="330" cy="110" r="5" fill="#D6B878"/>
    <circle cx="150" cy="180" r="7" fill="url(#gold-grad)" filter="url(#soft-glow)"/>
    <circle cx="280" cy="210" r="9" fill="url(#gold-grad)" filter="url(#soft-glow)"/>
    <circle cx="380" cy="280" r="4" fill="#D6B878"/>
    <circle cx="90" cy="290" r="5" fill="#D6B878"/>
    <circle cx="220" cy="320" r="6" fill="#D6B878"/>
    <circle cx="420" cy="130" r="3" fill="#A8A29E" fill-opacity="0.6"/>

    <!-- Node Coordinate Metadata -->
    <text x="296" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#D6B878" font-weight="600" opacity="0.8" letter-spacing="1">NODE_HUB // 0x2E</text>
    <text x="165" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#A8A29E" opacity="0.6" letter-spacing="1">SYSTEM_CORE</text>
    <text x="232" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#A8A29E" opacity="0.6" letter-spacing="1">NET_V3</text>
  </g>

  <!-- Left Content Area: Personal Brand Typography & Structure -->
  <g transform="translate(100, 0)">

    <!-- Top System Identification Pill -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1C1B19" stroke="#D6B878" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="16" cy="14" r="4" fill="#D6B878" filter="url(#soft-glow)"/>
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#D6B878" letter-spacing="2">SYSTEMS &amp; FULL-STACK ARCHITECTURE</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="64" font-weight="800" fill="url(#ivory-grad)" letter-spacing="4">AKSHAY N</text>

    <!-- Champagne Gold Accent Divider -->
    <rect x="2" y="210" width="460" height="2" fill="url(#gold-subtle)"/>
    <circle cx="2" cy="211" r="2.5" fill="#D6B878"/>

    <!-- Creed / Mission Tagline -->
    <text x="2" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="url(#gold-grad)" letter-spacing="6">BUILD  &#183;  EXPLORE  &#183;  INNOVATE</text>

    <!-- Engineering Philosophy Subtext -->
    <text x="2" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A8A29E" letter-spacing="1.5">
      Crafting resilient digital products, multithreaded systems &amp; data-driven applications
    </text>

    <!-- Specialized Domains Pills -->
    <g transform="translate(0, 312)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="11" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#D6B878" letter-spacing="1">01</text>
        <text x="20" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#E2DDD5" letter-spacing="1">DISTRIBUTED SYSTEMS</text>
      </g>

      <!-- Separator -->
      <text x="175" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#D6B878" opacity="0.4">&#47;</text>

      <!-- Item 2 -->
      <g transform="translate(195, 0)">
        <text x="0" y="11" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#D6B878" letter-spacing="1">02</text>
        <text x="20" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#E2DDD5" letter-spacing="1">JAVA CONCURRENCY</text>
      </g>

      <!-- Separator -->
      <text x="355" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#D6B878" opacity="0.4">&#47;</text>

      <!-- Item 3 -->
      <g transform="translate(375, 0)">
        <text x="0" y="11" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#D6B878" letter-spacing="1">03</text>
        <text x="20" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#E2DDD5" letter-spacing="1">REACT &amp; NEXT.JS</text>
      </g>

      <!-- Separator -->
      <text x="515" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#D6B878" opacity="0.4">&#47;</text>

      <!-- Item 4 -->
      <g transform="translate(535, 0)">
        <text x="0" y="11" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#D6B878" letter-spacing="1">04</text>
        <text x="20" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#E2DDD5" letter-spacing="1">GRAPH MINING &amp; 3D</text>
      </g>
    </g>
  </g>

  <!-- Editorial Blueprint Markings & Framing Elements -->
  <!-- Top-left bracket -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#D6B878" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Top-right bracket -->
  <path d="M 1176 40 L 1176 24 L 1160 24" fill="none" stroke="#D6B878" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Bottom-left bracket -->
  <path d="M 24 360 L 24 376 L 40 376" fill="none" stroke="#D6B878" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Bottom-right bracket -->
  <path d="M 1176 360 L 1176 376 L 1160 376" fill="none" stroke="#D6B878" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Coordinates & Build Meta -->
  <text x="50" y="38" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#A8A29E" opacity="0.6" letter-spacing="1.5">GEO // 12.9716°N · 77.5946°E</text>
  <text x="1035" y="38" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#D6B878" opacity="0.7" letter-spacing="1.5">STATUS // OPERATIONAL</text>

  <!-- Outer Elegant Border -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#332D24" stroke-width="1" stroke-opacity="0.75" rx="8"/>
</svg>
